name: Test activity discovery

on:
  pull_request:
    paths:
      - '.github/scripts/discovery/**'
      - '.github/workflows/discover-activities.yml'
      - '.github/workflows/test-discovery.yml'
      - 'data/activities.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/discovery/**'
      - '.github/workflows/discover-activities.yml'
      - '.github/workflows/test-discovery.yml'
      - 'data/activities.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/scripts/discovery/package-lock.json
      - run: npm ci --prefix .github/scripts/discovery --ignore-scripts
      - run: npm test --prefix .github/scripts/discovery
